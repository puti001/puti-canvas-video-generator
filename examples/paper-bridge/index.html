<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Puti-AI 紙橋工程師挑戰｜極致進化版</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #F9F7F1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
    }
    #stage {
      position: relative;
      width: 1920px;
      height: 1080px;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      display: block;
    }
    audio { display: none; }
  </style>
</head>
<body>
  <div id="stage" data-composition-id="paper-bridge-pro" data-start="0" data-duration="135.39" data-width="1920" data-height="1080" data-fps="30">
    <canvas id="film" class="clip" data-start="0" data-duration="135.39" data-track-index="0" width="1920" height="1080"></canvas>
    <audio id="voice" class="clip" data-start="0" data-duration="135.39" data-track-index="1" src="assets/narration.m4a"></audio>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="timeline.js"></script>
  <script src="animation.js"></script>
  <script>
    const state = { t: 0 };
    const duration = window.FILM ? window.FILM.duration : 135.39;
    document.querySelectorAll('[data-duration]').forEach(e => e.dataset.duration = duration);

    window.__timelines = {};
    if (typeof gsap !== 'undefined') {
      window.__timelines['paper-bridge-pro'] = gsap.timeline({ paused: true }).to(state, {
        t: duration,
        duration: duration,
        ease: 'none',
        onUpdate: () => {
          if (window.drawFilm) window.drawFilm(state.t);
        }
      }, 0);
    }
    if (window.drawFilm) window.drawFilm(0);
  </script>
</body>
</html>
