<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Puti-AI 紙橋工程師挑戰｜即時預覽端</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
    }
    #wrapper {
      position: relative;
      width: 960px;
      height: 540px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5), 0 8px 10px -6px rgba(0,0,0,0.5);
      background: #000;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #controls {
      width: 960px;
      display: flex;
      align-items: center;
      gap: 15px;
      margin-top: 15px;
      background: #1e293b;
      padding: 12px 20px;
      border-radius: 10px;
    }
    button {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #2563eb; }
    input[type="range"] {
      flex: 1;
      accent-color: #3b82f6;
      cursor: pointer;
    }
    #time-display {
      font-family: monospace;
      font-size: 15px;
      color: #94a3b8;
      min-width: 110px;
      text-align: right;
    }
  </style>
</head>
<body>
  <h2 style="margin-bottom: 12px; font-weight: 700; letter-spacing: 0.5px;">Puti-AI 紙橋工程師挑戰｜即時預覽與測試端</h2>
  <div id="wrapper">
    <canvas id="film" width="1920" height="1080"></canvas>
  </div>
  <div id="controls">
    <button id="play-btn">播放 ▶</button>
    <input type="range" id="seeker" min="0" max="100" step="0.01" value="0">
    <span id="time-display">00:00 / 00:00</span>
  </div>
  <audio id="audio" src="assets/narration.m4a"></audio>

  <script src="timeline.js"></script>
  <script src="animation.js"></script>
  <script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('play-btn');
    const seeker = document.getElementById('seeker');
    const timeDisplay = document.getElementById('time-display');

    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    }

    if (window.FILM) {
      seeker.max = FILM.duration;
      timeDisplay.textContent = `00:00 / ${formatTime(FILM.duration)}`;
    }

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        playBtn.textContent = '暫停 ⏸';
      } else {
        audio.pause();
        playBtn.textContent = '播放 ▶';
      }
    });

    seeker.addEventListener('input', (e) => {
      audio.currentTime = parseFloat(e.target.value);
      if (window.drawFilm) drawFilm(audio.currentTime);
    });

    function loop() {
      if (!audio.paused && window.drawFilm) {
        drawFilm(audio.currentTime);
        seeker.value = audio.currentTime;
        timeDisplay.textContent = `${formatTime(audio.currentTime)} / ${formatTime(FILM.duration)}`;
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
